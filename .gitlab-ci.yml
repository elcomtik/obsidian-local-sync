# .gitlab-ci.yml
#
# CI/CD for obsidian-local-sync
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ Every push                                                               │
# │   build  — compile TypeScript → dist/ and dist-daemon/                  │
# ├──────────────────────────────────────────────────────────────────────────┤
# │ Tag push  (git tag v0.0.8 && git push origin v0.0.8)                    │
# │   build → daemon-image → publish → release                               │
# │                                                                          │
# │   daemon-image  Builds and pushes the daemon container image.           │
# │   publish       Uploads the plugin ZIP to the GitLab Generic Package    │
# │                 Registry (permanent, versioned).                        │
# │                                                                          │
# │   release  Creates a GitLab Release entry (Deploy → Releases) with a   │
# │            permanent plugin download link and daemon image reference.   │
# └──────────────────────────────────────────────────────────────────────────┘
#
# No credentials or env vars need to be configured manually — GitLab injects
# CI_JOB_TOKEN, CI_API_V4_URL, CI_PROJECT_ID, and CI_COMMIT_TAG automatically.

default:
  image: node:22-alpine

stages:
  - build
  - image
  - publish
  - release

# ─── Build ───────────────────────────────────────────────────────────────────

build:
  stage: build
  script:
    - npm ci
    - npm run build:plugin
    - npm run build:daemon
  artifacts:
    # Pass the compiled plugin and daemon files to downstream jobs.
    # Also available for manual download from the pipeline UI (expires in 7 days).
    paths:
      - dist/main.js
      - dist/main.js.map
      - dist/manifest.json
      - dist-daemon/main.js
      - dist-daemon/main.js.map
    expire_in: 7 days

# ─── Daemon Image ────────────────────────────────────────────────────────────

daemon-image:
  stage: image
  image: docker:27
  services:
    - docker:27-dind
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE/daemon:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/daemon:$CI_COMMIT_SHORT_SHA"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$CI_REGISTRY_IMAGE/daemon:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE/daemon:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE/daemon:$CI_COMMIT_TAG"
      fi
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE/daemon:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE/daemon:main"
        docker push "$CI_REGISTRY_IMAGE/daemon:main"
      fi

# ─── Publish to Package Registry (tags only) ─────────────────────────────────

publish:
  stage: publish
  needs: [build]   # download build artifacts; don't wait for unrelated jobs
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - apk add --no-cache zip curl
    # -j  strips directory prefixes → zip root contains files directly
    - zip -j plugin.zip dist/main.js dist/main.js.map dist/manifest.json
    - |
      curl --fail \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file plugin.zip \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/obsidian-local-sync/${CI_COMMIT_TAG}/obsidian-local-sync-${CI_COMMIT_TAG}.zip"

# ─── Create GitLab Release (tags only) ───────────────────────────────────────

release:
  stage: release
  needs:
    - publish
    - daemon-image
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    name: "$CI_COMMIT_TAG"
    tag_name: "$CI_COMMIT_TAG"
    description: |
      ## Installation

      1. Download `obsidian-local-sync-$CI_COMMIT_TAG.zip`.
      2. Unzip — you get `main.js`, `main.js.map`, and `manifest.json`.
      3. Copy all three files to `<vault>/.obsidian/plugins/obsidian-local-sync/`.
      4. Reload Obsidian → enable the plugin.

      ## Daemon

      Use the daemon image:

      `"$CI_REGISTRY_IMAGE/daemon:$CI_COMMIT_TAG"`
    assets:
      links:
        - name: "obsidian-local-sync-$CI_COMMIT_TAG.zip"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/obsidian-local-sync/$CI_COMMIT_TAG/obsidian-local-sync-$CI_COMMIT_TAG.zip"
          link_type: package
        - name: "obsidian-local-sync daemon image"
          url: "$CI_PROJECT_URL/container_registry"
          link_type: image
