# .github/workflows/release.yml
#
# CI/CD for obsidian-local-sync
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ Every push (any branch or tag)                                           │
# │   unit-test/typecheck/smoke-daemon — verify the code                    │
# │   build  — compile plugin and daemon artifacts                          │
# ├──────────────────────────────────────────────────────────────────────────┤
# │ Tag push  (git tag v0.0.9 && git push origin v0.0.9)                    │
# │   build → release                                                        │
# │                                                                          │
# │   release  Zips plugin and daemon bundles and attaches both directly    │
# │            to a GitHub Release (no separate registry needed).           │
# └──────────────────────────────────────────────────────────────────────────┘
#
# No credentials or secrets need to be configured manually — GITHUB_TOKEN is
# injected automatically by GitHub Actions.

name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']

jobs:
  # ─── Test ──────────────────────────────────────────────────────────────────

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit

  smoke-daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run smoke:daemon

  # ─── Build ─────────────────────────────────────────────────────────────────

  build:
    needs:
      - unit-test
      - typecheck
      - smoke-daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm   # speeds up subsequent runs by restoring node_modules cache

      - run: npm ci
      - run: npm run build:plugin
      - run: npm run build:daemon

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-dist
          # upload-artifact@v4 strips the common dist/ prefix when all paths share it,
          # so downstream jobs receive main.js, main.js.map, manifest.json at root.
          path: |
            dist/main.js
            dist/main.js.map
            dist/manifest.json
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: daemon-dist
          path: |
            dist-daemon/main.js
            dist-daemon/main.js.map
          retention-days: 7

  # ─── Release (tags only) ───────────────────────────────────────────────────

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create a GitHub Release and upload assets

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugin-dist
          path: plugin-dist

      - uses: actions/download-artifact@v4
        with:
          name: daemon-dist
          path: daemon-dist

      - name: Create ZIP
        run: |
          zip -j "obsidian-local-sync-${{ github.ref_name }}.zip" \
            plugin-dist/main.js \
            plugin-dist/main.js.map \
            plugin-dist/manifest.json

          zip -j "obsidian-local-sync-daemon-${{ github.ref_name }}.zip" \
            daemon-dist/main.js \
            daemon-dist/main.js.map

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            obsidian-local-sync-${{ github.ref_name }}.zip
            obsidian-local-sync-daemon-${{ github.ref_name }}.zip
          body: |
            ## Installation

            1. Download `obsidian-local-sync-${{ github.ref_name }}.zip`.
            2. Unzip — you get `main.js`, `main.js.map`, and `manifest.json`.
            3. Copy all three files to `<vault>/.obsidian/plugins/obsidian-local-sync/`.
            4. Reload Obsidian → enable the plugin.

            ## Daemon

            Download `obsidian-local-sync-daemon-${{ github.ref_name }}.zip` if you
            want to run the bundled Node.js daemon without Docker.
